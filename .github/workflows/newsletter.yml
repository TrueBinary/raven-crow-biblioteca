name: Newsletter diária
# Resumo das notícias de ontem para os assinantes do Buttondown, às 07:05 de Brasília.
# O slug resumo-AAAA-MM-DD impede envio duplicado. Rodando à mão, o padrão é só contar os inscritos.
on:
  schedule:
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: resumo envia o e-mail do dia; inscritos só mostra a contagem
        type: choice
        options: [inscritos, resumo]
        default: inscritos
permissions:
  contents: read
jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: CLoudinhoooo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Newsletter (${{ inputs.modo || 'resumo' }})
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python newsletter_send.py ${{ inputs.modo || 'resumo' }}
