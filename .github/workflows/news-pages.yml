name: Atualizar paginas da Coluna
# Disabled 2026-11-08: GitHub Actions is billing-locked; the PC release (ops/cloudflare/release-local.ps1) builds pages every 15 min.
# To re-enable, restore the push trigger from git history.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build-raven.py
      - run: python build-column.py
      - run: python build-news-index.py
      - run: python build-library.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/noticias.html public/noticias public/sitemap.xml public/robots.txt public/raven-analytics.js public/editorial-feed.json public/editorial-images.json public/editorial/covers public/editorial/photos public/editorial-photo-credits.json public/creditos-fotos.html public/coluna.html public/coluna public/livros.html public/livros.json
          if ! git diff --cached --quiet; then git commit -m "Atualizar paginas indexaveis da Coluna"; git push; fi
